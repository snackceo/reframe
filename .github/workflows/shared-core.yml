name: Reframe shared core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Test shared core
        run: gradle :shared:allTests
